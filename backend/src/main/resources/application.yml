server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/scs_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 自定义JWT配置
jwt:
  secret: ${JWT_SECRET:screen-track-dev-secret-key-2026}
  expiration: 86400000
  token-header: Authorization
  token-prefix: "Bearer "

sms:
  code-expire-seconds: 300
  resend-interval-seconds: 60
  aliyun:
    endpoint: dysmsapi.aliyuncs.com
    access-key: ${ALIYUN_ACCESS_KEY:}
    access-key-secret: ${ALIYUN_ACCESS_SECRET:}
    sign-name: 速通互联验证码
    template-code: "100001"
